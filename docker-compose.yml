services:
  app:
    container_name: resto-template-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - NEXT_PUBLIC_WHATSAPP_NUMBER=22871030810
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/fr || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
